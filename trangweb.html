<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hệ Thống Quản Lý Bệnh Nhân</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>
    <header>
        <img 
          src="hospital-logo.webp" 
          alt="Ảnh Logo Bệnh Viện" 
          class = "hospital-logo"
        >
        <div>
            <h1 class="hospital-name">Bệnh Viện Đa Khoa Tâm Đức</h1>
            <p class="hospital-slogan">Tận tâm chăm sóc - Trao trọn niềm tin</p>
        </div>
    </header>
    <main class="login-container">
        <form action="#" method="POST" class="login-form">
            <div class="login-heading">ĐĂNG NHẬP HỆ THỐNG</div>
            <hr class = "duong-ke">
            <input type="text" class="account" placeholder="Nhập mã nhân viên" required>
            <input type="password" class="password" placeholder="Nhập mật khẩu" required> 
            <button type="submit" class="submit">Đăng nhập</button>
        </form>
    </main>
</body>
</html>
